function pdfUrl(path) {
  if (EMBEDDED[path]) {
    const bin = atob(EMBEDDED[path]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  }
  return path; // nayi PDF ho to pdfs folder se ayegi
}

/* बिहार के सभी 38 जिले */
const DISTRICTS = [
  "Sheikhpura", "Araria", "Arwal", "Aurangabad", "Banka", "Begusarai", "Bhagalpur", "Bhojpur",
  "Buxar", "Darbhanga", "East Champaran", "Gaya", "Gopalganj", "Jamui", "Jehanabad", "Kaimur",
  "Katihar", "Khagaria", "Kishanganj", "Lakhisarai", "Madhepura", "Madhubani", "Munger", "Muzaffarpur",
  "Nalanda", "Nawada", "Patna", "Purnia", "Rohtas", "Saharsa", "Samastipur", "Saran",
  "Sheohar", "Sitamarhi", "Siwan", "Supaul", "Vaishali", "West Champaran"
];


let renderToken = 0;
async function renderPdf(path, url) {
  const token = ++renderToken;
  const box = document.getElementById("pdfPages");
  const frame = document.getElementById("pdfFrame");
  box.innerHTML = "सूची लोड हो रही है...";
  frame.style.display = "none";
  try {
    if (!window.pdfjsLib) throw new Error("pdf.js load nahi hua");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    let src = { url: path };
    if (EMBEDDED[path]) {
      const bin = atob(EMBEDDED[path]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      src = { data: bytes };
    }
    const doc = await pdfjsLib.getDocument(src).promise;
    if (token !== renderToken) return;
    box.innerHTML = "";
    const width = Math.max(box.clientWidth, 1000);
    const out = Math.max(window.devicePixelRatio || 1, 2.5);
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const cssScale = width / page.getViewport({ scale: 1 }).width;
      const vp = page.getViewport({ scale: cssScale * out });
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      c.style.cssText = "display:block;margin-bottom:8px;border:1px solid #ccc;width:" + (vp.width / out) + "px;height:" + (vp.height / out) + "px;";
      box.appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  } catch (e) {
    if (token !== renderToken) return;
    box.innerHTML = "";
    frame.style.display = "block";
    frame.src = url;
  }
}

const districtEl = document.getElementById("district");
const villageEl  = document.getElementById("village");
const msgEl      = document.getElementById("msg");
const resultEl   = document.getElementById("result");

districtEl.innerHTML = '<option value="">-- जिला चुनें --</option>' +
  DISTRICTS.map(d => `<option value="${d}">${d}</option>`).join("");

districtEl.addEventListener("change", () => {
  resultEl.style.display = "none";
  msgEl.textContent = "";
  const villages = DATA[districtEl.value];
  if (!districtEl.value) {
    villageEl.disabled = true;
    villageEl.innerHTML = '<option value="">-- पहले जिला चुनें --</option>';
    return;
  }
  if (!villages) {
    villageEl.disabled = true;
    villageEl.innerHTML = '<option value="">-- कोई गाँव उपलब्ध नहीं --</option>';
    msgEl.textContent = "इस जिले की सूची अभी उपलब्ध नहीं है।";
    return;
  }
  villageEl.disabled = false;
  villageEl.innerHTML = '<option value="">-- गाँव चुनें --</option>' +
    Object.keys(villages).map(v => `<option value="${v}">${v}</option>`).join("");
});

villageEl.addEventListener("change", () => {
  msgEl.textContent = "";
  if (!villageEl.value) { resultEl.style.display = "none"; return; }
  const path = DATA[districtEl.value][villageEl.value];
  const pdf = pdfUrl(path);
  document.getElementById("title").textContent =
    `${villageEl.value}, ${districtEl.value}, बिहार — लाभार्थी सूची`;
  document.getElementById("openLink").href = pdf;
  document.getElementById("dlLink").href = pdf;
  document.getElementById("dlLink").download = villageEl.value + "-list.pdf";
  renderPdf(path, pdf);
  resultEl.style.display = "block";
});

districtEl.value = "Sheikhpura";
districtEl.dispatchEvent(new Event("change"));
